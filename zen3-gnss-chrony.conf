# GNSS samples are received by the local, unprivileged feeder over UDP, then
# copied into chrony's local SHM refclock. No Android control port is exposed.
allow 192.168.0.0/22
# Household policy: Zen3 GNSS is the preferred primary; Internet NTP remains
# configured and selectable as the automatic fallback when Zen3 is unavailable.
refclock SHM 0:perm=0666 refid ZEN3 poll 2 filter 4 delay 0.010 trust prefer
